name: Thalamed
description: Thalamed is a Berlin-based medical device procurement marketplace, founded in 2014,
  that connects healthcare providers such as clinics, private practices, and outpatient care facilities
  with suppliers of medical equipment including ultrasound and x-ray devices, sterilization and
  disinfection systems, and medical lasers. Customers describe the device they need and Thalamed's
  team evaluates the request and contacts the most suitable providers to deliver matching quotes,
  simplifying comparison and purchasing. The company is a Point Nine and RTAventures portfolio company.
  No public developer API, documentation, or integration surface is published as of this enrichment pass.
